<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generátor AI hudby</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body.theme-light {
            background: linear-gradient(to right, #f0f4f8, #e0ecf3);
            color: #222;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 250px;
        }

        body.theme-dark {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: #e0f7fa;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 250px;
        }

        body.theme-neon {
            background: linear-gradient(to right, #000000, #0f0f0f);
            color: #39ff14;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 250px;
        }

        .container {
            max-width: 1000px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-150px);
        }

        h1 {
            color: #007bff;
            font-weight: bold;
        }

        h1::before {
            content: "🎼 ";
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        #download-buttons-container {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        #download-buttons-container .btn {
            margin: 5px;
        }

        .history-button-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .prompt-label {
            color: #000000;
            font-weight: 500;
        }

        .theme-button {
            position: absolute;
            top: 20px;
            left: 10px;
            padding: 4px 10px;
            font-size: 0.875rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            z-index: 999;
            background-color: #007bff;
            color: white;
        }

        .theme-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
<div class="history-button-container">
    <a href="/history" class="btn btn-secondary btn-sm">Historie skladeb</a>
</div>

<button id="theme-toggle" class="theme-button">🎨 Přepnout motiv</button>

<div class="container">
    <h1 class="text-center mb-4">Generátor AI hudby</h1>

    <form id="musicForm">
        <div class="form-group">
            <label for="title" class="prompt-label">Název skladby (volitelné):</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="Např. Moje rocková pecka">
        </div>

        <div class="form-group">
            <label for="structure" class="prompt-label">Struktura skladby (volitelné):</label>
            <input type="text" class="form-control" id="structure" name="structure" placeholder="Např. intro, verse, chorus, bridge, outro">
            <small class="form-text text-muted mt-2">
                Můžeš napsat strukturu skladby, např. "intro, verse, chorus, verse, chorus, outro"
            </small>
        </div>

        <div class="form-group">
            <label for="prompt" class="prompt-label">Zadejte popis skladby:</label>
            <textarea class="form-control" id="prompt" name="prompt" rows="3"></textarea>
            <small class="form-text text-muted mt-2">
                Zadejte žánr, tempo, nástroje, délku, náladu atd. Např: 'Rychlá rocková skladba s bubny a elektrickou kytarou, tempo 140...'
            </small>
        </div>

        <!-- 1) Dropdown model -->
        <div class="form-group">
            <label for="model-select" class="prompt-label">Model:</label>
            <select id="model-select">
                <option value="basic_rnn">Basic RNN (výchozí)</option>
                <option value="attention_rnn">Attention RNN</option>
                <option value="lookback_rnn">Lookback RNN</option>
            </select>
        </div>

        <!-- 2) Dropdown žánr -->
        <div class="form-group">
            <label for="genre-select" class="prompt-label">Žánr:</label>
            <select id="genre-select">
                <option value="pop">Pop (výchozí)</option>
                <option value="rock">Rock</option>
                <option value="jazz">Jazz</option>
                <option value="classical">Classical</option>
                <option value="electronic">Electronic</option>
            </select>
        </div>

        <!-- 3) Volný vstup délky -->
        <div class="form-group">
            <label for="length-input" class="prompt-label">Délka (s):</label>
            <input id="length-input" type="number" min="1" value="30" class="form-control d-inline-block"
                   style="width: 8ch;">
        </div>

        <!-- 4) Volný vstup tempa -->
        <div class="form-group">
            <label for="tempo-input" class="prompt-label">Tempo (BPM):</label>
            <input id="tempo-input" name="tempo" type="number" min="20" max="300" value="120" class="form-control" style="width: 8ch;">
        </div>

        <!-- INSTRUMENTY -->
        <div class="form-group">
            <label class="prompt-label">Nástroje:</label>
            <div id="instruments-container">
                <div class="instrument-item mb-2">
                    <select name="instruments[]" class="form-control d-inline-block" style="width:auto;">
                        {% for name, midi in instruments.items() %}
                            <option value="{{ midi }}">{{ name.title() }}</option>
                        {% endfor %}
                    </select>
                    <button type="button" class="btn btn-sm btn-danger remove-item">✕</button>
                </div>
            </div>
            <button type="button" id="add-instrument" class="btn btn-sm btn-secondary">+ Přidat nástroj</button>
        </div>

        <!-- AKORDY -->
        <div class="form-group">
            <label class="prompt-label">Akord:</label>
            <div id="chords-container">
                <div class="chord-item mb-2">
                    <select name="chords[]" class="form-control d-inline-block" style="width:auto;">
                        {% set seen = [] %}
                        {% for seq in chord_map.values() %}
                            {% for ch in seq %}
                                {% if ch not in seen %}
                                    {% do seen.append(ch) %}
                                    <option value="{{ ch }}">{{ ch }}</option>
                                {% endif %}
                            {% endfor %}
                        {% endfor %}
                    </select>
                    <button type="button" class="btn btn-sm btn-danger remove-item">✕</button>
                </div>
            </div>
            <button type="button" id="add-chord" class="btn btn-sm btn-secondary">+ Přidat akord</button>
        </div>
        <button type="submit" id="generateButton" class="btn btn-primary btn-block">Generovat hudbu</button>
    </form>

    <div id="statusMessage" class="status-message alert" style="display: none;"></div>
    <div id="download-buttons-container"></div>
</div>

<script>
    document.getElementById('musicForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const promptText = document.getElementById('prompt').value.trim();
        const title = document.getElementById('title').value.trim();
        const structure = document.getElementById('structure').value.trim();
        const model = document.getElementById('model-select').value;
        const genre = document.getElementById('genre-select').value;
        const length = parseInt(document.getElementById('length-input').value, 10);
        const tempo = parseInt(document.getElementById('tempo-input').value, 10);

        // Alespoň jedno z toho musí být: buď prompt, nebo dropdowny
        if (!promptText && !model && !genre && !length) {
            alert('Prosím napište prompt nebo vyberte alespoň jeden parametr.');
            return;
        }

        // Postavíme tělo požadavku tak, aby když je promptText, tak se prompt použije,
        // jinak ho vynecháme a pošlou se dropdownové hodnoty.
        const body = { title, structure, };
        if (promptText) {
            body.prompt = promptText;
        }
        // vždycky pošleme tyto čtyři hodnoty, backend na ně může sáhnout
        body.model = model;
        body.genre = genre;
        body.length = length;
        body.tempo = tempo;

        // (volitelně) případně další parametry: temperature apod.

        // pak úplně stejný fetch jako teď
        const statusMessage = document.getElementById('statusMessage');
        const downloadButtonsContainer = document.getElementById('download-buttons-container');
        const generateButton = document.getElementById('generateButton');

        statusMessage.innerText = '🎵 Generuji hudbu... Tento proces může chvíli trvat, prosím čekejte.';
        statusMessage.className = 'status-message alert alert-info';
        statusMessage.style.display = 'block';
        downloadButtonsContainer.style.display = 'none';
        downloadButtonsContainer.innerHTML = '';

        generateButton.disabled = true;
        generateButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Generuji...';

        // posbíráme všechny vybrané nástroje
        const instruments = Array.from(
            document.querySelectorAll('select[name="instruments[]"]')
        ).map(s => s.value);

        // posbíráme všechny vybrané akordy
        const chords = Array.from(
            document.querySelectorAll('select[name="chords[]"]')
        ).map(s => s.value);

        body.instruments = instruments;
        body.chords = chords;

        try {
            const resp = await fetch('/generate_music', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || resp.statusText);

            // vypíšeme odkazy na stažení MIDI/WAV
            statusMessage.innerText = 'Hudba byla úspěšně vygenerována!';
            statusMessage.className = 'status-message alert alert-success';

            const midiFilename = data.midi_file.split('/').pop();
            const wavFilename = data.wav_file.split('/').pop();
            downloadButtonsContainer.innerHTML = `
                <a href="/download_music/${midiFilename}" class="btn btn-primary" download="${midiFilename}">Stáhnout MIDI</a>
                <a href="/download_music/${wavFilename}" class="btn btn-success" download="${wavFilename}">Stáhnout WAV</a>
                <br>
                <audio controls style="margin-top: 15px; width: 100%;">
                   <source src="/download_music/${wavFilename}" type="audio/wav">
                   Váš prohlížeč nepodporuje přehrávání audia.
                </audio>
                `;
            downloadButtonsContainer.style.display = 'block';

        } catch (err) {
            console.error(err);
            statusMessage.innerText = 'Chyba: ' + err.message;
            statusMessage.className = 'status-message alert alert-danger';
        } finally {
            generateButton.disabled = false;
            generateButton.innerHTML = 'Generovat hudbu';
        }
      });
</script>

<script>
    function setupDynamicList(addBtnId, containerId, itemClass) {
        const addBtn = document.getElementById(addBtnId);
        const container = document.getElementById(containerId);

        // když kliknu na "+" - naklonuji první položku
        addBtn.addEventListener('click', () => {
            const first = container.querySelector(`.${itemClass}`);
            const clone = first.cloneNode(true);
            container.appendChild(clone);
        });

        // když kliknu na "✕" - smažu položku (pokud jich je víc než jedna)
        container.addEventListener('click', e => {
            if (e.target.classList.contains('remove-item')) {
                const item = e.target.closest(`.${itemClass}`);
                if (container.querySelectorAll(`.${itemClass}`).length > 1) {
                    item.remove();
                }
            }
        });
    }

    // inicializace dvou políček
    setupDynamicList('add-instrument', 'instruments-container', 'instrument-item');
    setupDynamicList('add-chord', 'chords-container', 'chord-item');
</script>

<script>
    const themes = ['theme-light', 'theme-dark', 'theme-neon'];
    let currentThemeIndex = 0;

    function applyTheme(index) {
        document.body.classList.remove(...themes);
        document.body.classList.add(themes[index]);
        localStorage.setItem('theme', themes[index]);
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        applyTheme(currentThemeIndex);
    });

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme && themes.includes(savedTheme)) {
            currentThemeIndex = themes.indexOf(savedTheme);
            applyTheme(currentThemeIndex);
        } else {
            applyTheme(0);
        }
    });
</script>

<script>
const PRESETS = {
    pop_default: { model: 'lookback_rnn', genre: 'pop', length: '30', tempo: '120', temperature: '1.0'},
    rock_fast: { model: 'basic_rnn', genre: 'rock', length: '30', tempo: '160', temperature: '0.8'},
    jazz_slow: { model: 'attention_rnn', genre: 'jazz', length: '30', tempo: '90', temperature: '1.2'}
};

document.getElementById('preset').addEventListener('change', e => {
    const vals = PRESETS[e.target.value] || {};
    // projdi všechny klíče a najdi odpovídající input/select
    for (let [key, val] of Object.entries(vals)) {
        const el = document.querySelector(`[name="${key}"]`);
        if (el) el.value = val;
    }
});
</script>
</body>
</html>
